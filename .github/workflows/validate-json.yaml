name: JSON Schema Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install jsonschema==4.26.0
      - name: Test allocation and validation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate submission and published identifiers
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git show "origin/$BASE_REF:softbinding-algorithm-list.json" > "$RUNNER_TEMP/published.json"
          if [ "$EVENT" = pull_request ]; then
            python .github/scripts/registry.py --submission --published "$RUNNER_TEMP/published.json"
          else
            python .github/scripts/registry.py --published "$RUNNER_TEMP/published.json"
          fi

  # Make this required in branch protection. ID-less submissions pass
  # validate-json but cannot merge; prepared registrations pass both checks.
  publish-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - name: Require assigned IDs and preserve published entries
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git show "origin/$BASE_REF:softbinding-algorithm-list.json" > "$RUNNER_TEMP/published.json"
          if git show-ref --verify --quiet refs/remotes/origin/bot/identifier-allocations; then
            git show origin/bot/identifier-allocations:identifier-allocations.json > "$RUNNER_TEMP/allocations.json"
          else
            echo '{}' > "$RUNNER_TEMP/allocations.json"
          fi
          python .github/scripts/registry.py --published "$RUNNER_TEMP/published.json" --ledger "$RUNNER_TEMP/allocations.json"
