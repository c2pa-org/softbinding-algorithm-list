name: Allocate algorithm identifiers

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Reviewed source PR with the ready-to-register label'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Ref updates also handle simultaneous requests safely. GitHub may replace an
# older pending run in this group; reapply the label or dispatch it to retry.
concurrency:
  group: sbr-identifier-allocator
  cancel-in-progress: false

jobs:
  allocate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-to-register'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out or execute code from the source PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - name: Reserve IDs and prepare registration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/allocate_identifiers.py
