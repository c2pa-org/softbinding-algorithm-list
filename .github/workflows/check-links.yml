name: Check Links Monthly

on:
  schedule:
    - cron: '17 3 1 * *'    # 03:17 UTC on the first day of each month
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  issues: write   # required for actions/github-script to create/update issues

env:
  FILE_TO_CHECK: softbinding-algorithm-list.json

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check links in file
        id: check
        run: python .github/workflows/check_links.py --file "$FILE_TO_CHECK"
        continue-on-error: true

      - name: Upload report artifact
        if: always() && hashFiles('link_check_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link_check_report.json

      - name: Reconcile broken-links issue
        if: steps.check.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('link_check_report.json', 'utf8'));
            const broken = report.results.filter(r => r.state === 'broken');
            const blocked = report.results.filter(r => r.state === 'blocked');
            const unreachable = report.results.filter(r => r.state === 'unreachable');

            const title = `Broken links found in ${report.file}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);

            if (!broken.length) {
              if (existing && !blocked.length && !unreachable.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All links passed the latest check. Closing this issue.\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed'
                });
              } else if (existing) {
                const unverified = [...blocked, ...unreachable];
                const table = items => [
                  '| Algorithm | Field | URL | Result |',
                  '|---|---|---|---|',
                  ...items.map(item => `| ${item.algorithm} | ${item.field} | ${item.url} | ${item.error} |`)
                ].join('\n');
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: [
                    'The latest check found no confirmed broken links, but some URLs could not be verified.',
                    '',
                    table(unverified),
                    '',
                    `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
                  ].join('\n')
                });
              }
              return;
            }

            const table = items => [
              '| Algorithm | Field | URL | Result |',
              '|---|---|---|---|',
              ...items.map(item => `| ${item.algorithm} | ${item.field} | ${item.url} | ${item.error} |`)
            ].join('\n');
            const sections = [
              `The monthly link check found ${broken.length} confirmed broken link(s) in \`${report.file}\`.`,
              '',
              '## Broken',
              '',
              table(broken)
            ];
            if (blocked.length) sections.push('', '## Blocked', '', table(blocked));
            if (unreachable.length) sections.push('', '## Unreachable', '', table(unreachable));
            sections.push('', `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`);
            const body = sections.join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links']
              });
            }

      - name: Fail workflow if broken links were found
        if: steps.check.outputs.result == 'broken'
        run: exit 1

      - name: Fail workflow if the checker failed
        if: steps.check.outcome == 'failure' && steps.check.outputs.result == ''
        run: exit 1
