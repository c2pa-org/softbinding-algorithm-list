name: Check Links Quarterly

on:
  schedule:
    - cron: '0 0 1 */3 *'   # 00:00 UTC on the 1st of Jan, Apr, Jul, Oct
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

env:
  FILE_TO_CHECK: softbinding-algorithm-list.json

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check links in file
        id: check
        run: python .github/workflows/check_links.py --file "$FILE_TO_CHECK"
        continue-on-error: true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link_check_report.json

      - name: Create or update issue on broken links
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('link_check_report.json', 'utf8'));
            const broken = report.results.filter(r => !r.ok);

            const title = `Broken links found in ${report.file}`;
            const body = [
              `The quarterly link check found ${broken.length} broken link(s) in \`${report.file}\`:`,
              '',
              ...broken.map(b => `- [ ] ${b.url} — ${b.error}`),
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links'
            });

            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links']
              });
            }

      - name: Fail workflow if broken links were found
        if: steps.check.outcome == 'failure'
        run: exit 1
